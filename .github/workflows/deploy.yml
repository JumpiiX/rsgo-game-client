name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /root
          rm -rf rsgo-backend
          git clone https://github.com/JumpiiX/rsgo-backend.git
          cd rsgo-backend
          docker stop rsgo-backend || true
          docker rm rsgo-backend || true
          docker network create rsgo-shared-network 2>/dev/null || true
          docker-compose down || true
          docker-compose build --no-cache
          docker run -d --name rsgo-backend --network rsgo-shared-network -p 6969:6969 --restart unless-stopped rsgo-backend-backend:latest