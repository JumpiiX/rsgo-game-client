name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          set -e
          cd /root
          rm -rf rsgo-backend
          git clone https://github.com/JumpiiX/rsgo-backend.git
          cd rsgo-backend
          docker stop rsgo-backend || true
          docker rm rsgo-backend || true
          # Shared network so Caddy can reach the backend by name (rsgo-backend:6969).
          docker network create rsgo-shared-network 2>/dev/null || true
          docker-compose down || true
          docker-compose build --no-cache
          # NO public -p port: Caddy proxies /ws -> rsgo-backend:6969 internally.
          # -e RUST_LOG=info so lobby/join logs appear in `docker logs rsgo-backend`.
          docker run -d --name rsgo-backend \
            --network rsgo-shared-network \
            --restart unless-stopped \
            -e RUST_LOG=info \
            rsgo-backend-backend:latest